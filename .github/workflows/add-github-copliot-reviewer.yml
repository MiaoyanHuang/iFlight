name: Copilot PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Copilot Review
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          MARKER="<!-- copilot-review-trigger -->"

          echo "PR number: $PR_NUMBER"

          if gh api \
            --method GET \
            "/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | grep -q .; then
            echo "Copilot review already triggered, skipping..."
            exit 0
          fi

          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body-file ".github/prompt/github_copilot_code_review.txt"
