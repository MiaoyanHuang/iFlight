name: Add Reviewer

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  add-reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Add reviewer using user B token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_COPILOT_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-reviewer Copilot