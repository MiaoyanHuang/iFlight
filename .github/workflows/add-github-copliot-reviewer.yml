name: Add Reviewer

on:
  pull_request_target:
    types: [opened, ready_for_review]

jobs:
  add-reviewer:
    runs-on: ubuntu-latest
    environment: prod

    steps:
    - name: Add reviewer via API
      env:
        GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
      run: |
        gh api \
          repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers \
          -X POST \
          -f reviewers='["Copilot"]' \