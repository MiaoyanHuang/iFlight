name: Add Reviewer

on:
  pull_request_target:
    types: [opened, ready_for_review]

jobs:
  add-reviewer:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add reviewer
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-reviewer Copilot